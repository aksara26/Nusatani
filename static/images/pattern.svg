<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="rice-pattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Rice terrace lines -->
      <path d="M0 120 L120 0 M0 90 L90 0 M30 120 L120 30 M60 120 L120 60 M90 120 L120 90" 
            stroke="#2f6b3a" stroke-width="0.5" fill="none" opacity="0.05"/>
      <!-- Sprout/leaf motifs -->
      <g fill="#2f6b3a" opacity="0.04">
        <path d="M20 20 Q25 15 30 20 Q25 25 20 20" />
        <path d="M80 30 Q85 25 90 30 Q85 35 80 30" />
        <path d="M40 80 Q45 75 50 80 Q45 85 40 80" />
        <path d="M100 90 Q105 85 110 90 Q105 95 100 90" />
        <path d="M10 100 Q15 95 20 100 Q15 105 10 100" />
        <path d="M70 110 Q75 105 80 110 Q75 115 70 110" />
      </g>
      <!-- Subtle grain dots -->
      <circle cx="15" cy="15" r="0.5" fill="#2f6b3a" opacity="0.03"/>
      <circle cx="60" cy="45" r="0.5" fill="#2f6b3a" opacity="0.03"/>
      <circle cx="105" cy="75" r="0.5" fill="#2f6b3a" opacity="0.03"/>
      <circle cx="30" cy="95" r="0.5" fill="#2f6b3a" opacity="0.03"/>
      <circle cx="90" cy="10" r="0.5" fill="#2f6b3a" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#rice-pattern)"/>
</svg>